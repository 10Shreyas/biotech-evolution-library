name: Daily research library refresh

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install podcast speech package
        run: python -m pip install edge-tts
      - name: Fetch papers and feeds
        run: |
          mkdir -p /tmp/biotech-data-backup
          cp -a data/. /tmp/biotech-data-backup/
          if ! python3 fetch.py --all; then
            rm -f data/*.json
            cp -a /tmp/biotech-data-backup/. data/
            echo 'Fetch failed; restored existing data.'
            exit 1
          fi
      - name: Summarize abstracts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 summarize.py
      - name: Create weekly podcast episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 podcast.py
      - name: Commit and push refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data podcast || git add -A data
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m 'chore: refresh research library data'
            git push origin HEAD:main
          fi
